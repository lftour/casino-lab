<!DOCTYPE html>
<html>
<head>
  <title>User Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
</head>
<body>
  <div class="container">
    <nav><a href="index.html">« Admin</a></nav>
    <h2>Users</h2>
    <table id="usersTable">
      <thead><tr><th>Username</th><th>Balance</th><th>Role</th><th>Adjust Balance</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    requireAuth();
    loadUsers();

    async function loadUsers() {
      const users = await apiFetch('/admin/users');
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.username}</td>
          <td>${u.balance}</td>
          <td>${u.role}</td>
          <td>
            <input type="number" id="adj-${u.id}" placeholder="Amount" style="width:80px">
            <button onclick="adjust('${u.id}')">Update</button>
          </td>
        </tr>
      `).join('');
    }

    window.adjust = async (id) => {
      const amount = +document.getElementById('adj-' + id).value;
      if (isNaN(amount)) return alert('Enter a number');
      await apiFetch('/admin/users/' + id + '/balance', {
        method: 'POST',
        body: JSON.stringify({ amount })
      });
      loadUsers();
    };
  </script>
</body>
</html>
